x-v5-node: &v5-node
  build: .
  cap_add:
    - NET_ADMIN
  volumes:
    - ./v5_background.py:/opt/cyberwm/v5_background.py:ro
  command:
    - bash
    - -lc
    - "mkdir -p /srv/http; printf 'lab background\\n' >/srv/http/index.html; python3 -m http.server 8080 --directory /srv/http >/tmp/http.log 2>&1 & exec /usr/sbin/sshd -D -e"
  networks:
    labnet_v5: {}

services:
  ws1:
    <<: *v5-node
    hostname: ws1
    networks:
      labnet_v5:
        ipv4_address: 10.77.0.20

  ws2:
    <<: *v5-node
    hostname: ws2
    networks:
      labnet_v5:
        ipv4_address: 10.77.0.25

  srv1:
    <<: *v5-node
    hostname: srv1
    networks:
      labnet_v5:
        ipv4_address: 10.77.0.30

  srv2:
    <<: *v5-node
    hostname: srv2
    networks:
      labnet_v5:
        ipv4_address: 10.77.0.40

  admin1:
    <<: *v5-node
    hostname: admin1
    networks:
      labnet_v5:
        ipv4_address: 10.77.0.50

networks:
  labnet_v5:
    internal: true
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: cyberwmv5
    ipam:
      config:
        - subnet: 10.77.0.0/24
